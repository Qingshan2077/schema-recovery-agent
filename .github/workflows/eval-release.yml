name: eval-release
on: { workflow_dispatch: {} }
jobs:
  release-gate:
    environment: eval-hidden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python scripts/eval/run_eval.py --mode release --split hidden_test --enforce-gate
        env:
          EVAL_V2_ENABLED: "true"
          CI_GATE_ENFORCED: "true"
          EVAL_DATASET_ID: ${{ vars.EVAL_HIDDEN_DATASET_ID }}
          EVAL_DATASET_VERSION: ${{ vars.EVAL_HIDDEN_DATASET_VERSION }}
          EVAL_CASE_EXECUTOR: ${{ vars.EVAL_HIDDEN_CASE_EXECUTOR }}
          DEPLOYMENT_GIT_SHA: ${{ github.sha }}
          DEPLOYMENT_DIRTY_WORKTREE: "false"
